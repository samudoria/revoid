name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test app and run tests
        run: |
          ./test-app/build.sh
          REVOID_OUTPUT_ROOT="$RUNNER_TEMP/out" ./gradlew test
      - name: Build fat JAR
        run: ./gradlew shadowJar
      - name: Name artifact after the tag
        run: cp build/libs/jadx-headless-mcp-all.jar "revoid-${GITHUB_REF_NAME}.jar"
        if: startsWith(github.ref, 'refs/tags/')
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: revoid-*.jar
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: revoid-jar
          path: build/libs/jadx-headless-mcp-all.jar
